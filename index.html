<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 资讯源看板</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.8; }
  .sub .src-badge { display: inline-flex; align-items: center; gap: 4px; background: #21262d; border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-right: 6px; }
  .sub .src-badge .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sub .src-badge .dot.ok { background: var(--green); }
  .sub .src-badge .dot.failed { background: var(--red); }
  .sub .src-badge .dot.disabled { background: var(--muted); }
  .sub .src-badge .src-count { color: var(--muted); }
  .sub .src-badge.failed .src-count { color: var(--red); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 13px; color: var(--accent); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  /* ---- 时间轴：主内容 ---- */
  .timeline { display: flex; flex-direction: column; }
  .tl-batch { position: relative; padding: 14px 0 14px 22px; border-left: 2px solid var(--border); margin-left: 8px; }
  .tl-batch::before { content: ''; position: absolute; left: -7px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
  .tl-batch:last-child { border-left-color: transparent; }
  .tl-time { font-size: 14px; color: var(--accent); font-weight: 700; }
  .tl-sub { font-size: 12px; color: var(--muted); margin: 3px 0 10px; }

  /* 每个批次的条目卡片 */
  .tl-items { display: flex; flex-direction: column; gap: 8px; }
  .tl-item { background: #21262d; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: border-color .15s; }
  .tl-item:hover { border-color: var(--accent); }
  .tl-item .t { font-size: 14px; line-height: 1.45; color: var(--text); }
  .tl-item:hover .t { color: var(--accent); }
  .tl-item .m { display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .tl-item .src { font-size: 11px; color: var(--accent); }
  .tl-item .imp { font-size: 11px; color: var(--yellow); }
  .tl-item .sum { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
  .badge.tier0 { background: rgba(88,166,255,.2); color: var(--accent); }
  .badge.tier1 { background: rgba(139,148,158,.2); color: var(--muted); }

  .tl-more { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 5px 12px; transition: border-color .15s; }
  .tl-more:hover { border-color: var(--accent); background: rgba(88,166,255,.08); }
  .tl-more .arrow { transition: transform .2s; }
  .tl-more.open .arrow { transform: rotate(180deg); }
  .tl-empty, .loading, .error { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .error { color: var(--red); }
</style>
</head>
<body>
  <h1>📡 AI 资讯源看板</h1>
  <div class="sub" id="generated-info">加载中…</div>

  <div class="panel">
    <h2>采集时间轴（每 2h 一轮）</h2>
    <div id="timeline" class="loading">加载中…</div>
  </div>

<script>
// 相对路径：Pages 部署在 /ai-source/ 子路径，必须 ./ 开头（见 HANDOFF 10.2）
const DATA = './data/';

async function fetchJSON(name) {
  const r = await fetch(DATA + name, { cache: 'no-store' });
  if (!r.ok) throw new Error(name + ' HTTP ' + r.status);
  return r.json();
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

// 把 UTC ISO 时间转成浏览器本地时区，返回 "MM-DD HH:MM"（无歧义可读）
function fmtLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso); // ISO 带 +00:00 偏移，浏览器正确解析为 UTC 时刻
  if (isNaN(d.getTime())) return iso;
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtLocalLong(iso) {
  if (!iso) return '';
  return fmtLocal(iso) + ' (本地)';
}

// 源健康：返回副标题内的小徽章（DOM 元素数组）
function healthBadges(status) {
  const badges = [];
  const names = Object.keys(status);
  for (const name of names) {
    const s = status[name];
    const b = el('span', 'src-badge ' + (s.status === 'failed' ? 'failed' : ''));
    b.appendChild(el('span', 'dot ' + (s.status === 'ok' ? 'ok' : (s.status === 'failed' ? 'failed' : 'disabled'))));
    b.appendChild(document.createTextNode(name));
    if (s.status === 'ok') b.appendChild(el('span', 'src-count', ' ' + (s.item_count ?? 0)));
    else if (s.status === 'failed') b.appendChild(el('span', 'src-count', ' 失败' + (s.fail_count ?? 0)));
    else b.appendChild(el('span', 'src-count', ' off'));
    if (s.status === 'failed') b.title = s.error || '';
    badges.push(b);
  }
  return badges;
}

// 单个条目的卡片
function makeItemCard(it) {
  const card = el('div', 'tl-item');
  card.appendChild(el('div', 't', it.title));
  const m = el('div', 'm');
  m.appendChild(el('span', 'src', it.source_label || it.source));
  m.appendChild(el('span', 'badge tier' + (it.tier || 1), 'tier' + (it.tier || 1)));
  if (it.importance != null) m.appendChild(el('span', 'imp', '重要性 ' + it.importance));
  if (it.published_at) m.appendChild(el('span', '', fmtLocal(it.published_at)));
  card.appendChild(m);
  if (it.summary) card.appendChild(el('div', 'sum', it.summary));
  card.addEventListener('click', () => it.url && window.open(it.url, '_blank'));
  return card;
}

// 时间轴：每轮一个批次，默认展示 top 10，其余折叠在"展开"按钮里
const TL_TOP = 10;
function renderTimeline(batches, container) {
  container.innerHTML = '';
  if (!batches || !batches.length) { container.appendChild(el('div', 'tl-empty', '暂无采集批次')); return; }
  for (const b of batches.slice().reverse()) {
    const cnt = (b.items || []).length;
    if (!cnt) continue;  // 空批次（本轮无 AI 相关条目）不显示节点

    const div = el('div', 'tl-batch');
    const timeStr = fmtLocalLong(b.generated_at) || '?';
    div.appendChild(el('div', 'tl-time', timeStr));
    const srcs = Object.entries(b.sources || {})
      .filter(([, n]) => n > 0)
      .map(([n, c]) => n + ':' + c).join(' · ');
    div.appendChild(el('div', 'tl-sub', cnt + ' 条 ｜ ' + srcs));

    const itemsWrap = el('div', 'tl-items');
    const items = (b.items || []).slice();  // 副本，保持原始顺序
    {
      const top = items.slice(0, TL_TOP);
      const rest = items.slice(TL_TOP);
      top.forEach(it => itemsWrap.appendChild(makeItemCard(it)));
      if (rest.length) {
        // 折叠容器（默认隐藏）+ 展开/收起按钮
        const moreWrap = el('div');
        moreWrap.style.display = 'none';
        rest.forEach(it => moreWrap.appendChild(makeItemCard(it)));
        const moreBtn = el('button', 'tl-more');
        moreBtn.appendChild(el('span', null, '展开剩余 ' + rest.length + ' 条'));
        moreBtn.appendChild(el('span', 'arrow', '▾'));
        moreBtn.addEventListener('click', () => {
          const open = moreWrap.style.display !== 'none';
          moreWrap.style.display = open ? 'none' : 'block';
          moreBtn.classList.toggle('open', !open);
          moreBtn.firstChild.textContent = open ? '展开剩余 ' + rest.length + ' 条' : '收起';
        });
        itemsWrap.appendChild(moreWrap);
        itemsWrap.appendChild(moreBtn);
      }
      div.appendChild(itemsWrap);
    }
    container.appendChild(div);
  }
}

(async () => {
  try {
    const [status, latest, batches] = await Promise.all([
      fetchJSON('source-status.json'),
      fetchJSON('latest-24h.json'),
      fetchJSON('batches.json'),
    ]);
    const info = document.getElementById('generated-info');
    info.innerHTML = '';
    info.appendChild(document.createTextNode('数据更新于 ' + fmtLocalLong(latest.meta?.generated_at) + ' ｜ 共 ' + latest.meta?.total + ' 条　'));
    healthBadges(status).forEach(b => info.appendChild(b));
    renderTimeline(batches.batches, document.getElementById('timeline'));
  } catch (e) {
    document.getElementById('generated-info').textContent = '加载失败';
    const tl = document.getElementById('timeline');
    tl.innerHTML = '';
    tl.appendChild(el('div', 'error', '加载失败: ' + e.message));
  }
})();
</script>
</body>
</html>
