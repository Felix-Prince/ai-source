# 信源注册表
# 每个源：
#   name      — 唯一标识，用作 source-status.json 的 key 与输出 source 字段
#   url       — RSS/Atom/JSON feed 端点（验证过可达才启用）
#   type      — rss | static_page（当前 MVP 全 rss）
#   category  — domestic | international
#   tier      — 0=官方一手源(OpenAI/Anthropic/HF/arXiv) 1=媒体RSS
#   enabled   — 是否参与采集；enabled:false 的源在 source-status 里显示为 disabled
#   lang      — zh | en（normalize 用）
#
# 启用原则：仅启用家中网络 + GH Actions 都验证过可达的源。
# 见 HANDOFF.md 第五·五节 D2 验证结果。
# 注：Hacker News / HuggingFace 家中网络不可达（US 托管），待阶段3 CI 验证后再决定。

sources:
  # ---------- MVP 首源：官方一手 ----------
  - name: openai_blog
    url: https://openai.com/news/rss.xml
    type: rss
    category: international
    tier: 0
    enabled: true
    lang: en

  # arXiv：官方一手，但端点按批次出条目，可能为空（2026-08-01 实测空）。
  # 不是 bug——源可达即 ok，无条目时 item_count=0。阶段2 再评估是否保留。
  - name: arxiv_cs_ai
    url: https://export.arxiv.org/rss/cs.AI
    type: rss
    category: international
    tier: 0
    enabled: false
    lang: en

  # ---------- 其余验证可用源（阶段2 已启用） ----------

  - name: the_verge
    url: https://www.theverge.com/rss/index.xml
    type: rss
    category: international
    tier: 1
    enabled: true
    lang: en
    source_label: The Verge

  - name: techcrunch
    url: https://techcrunch.com/feed/
    type: rss
    category: international
    tier: 1
    enabled: true
    lang: en
    source_label: TechCrunch

  - name: ars_technica
    url: https://feeds.arstechnica.com/arstechnica/index
    type: rss
    category: international
    tier: 1
    enabled: true
    lang: en
    source_label: Ars Technica

  # 36氪：2026-08-13 源端风控，所有端点返回 HTML 挑战页（HTTP 200 但非 feed）。
  # 8-01 曾正常出 30 条，8-13 起 failed。保持 enabled:true 观察，等风控解除自动恢复。
  - name: kr36
    url: https://36kr.com/feed
    type: rss
    category: domestic
    tier: 1
    enabled: true
    lang: zh
    source_label: 36氪

  - name: qbitai
    url: https://www.qbitai.com/feed
    type: rss
    category: domestic
    tier: 1
    enabled: true
    lang: zh
    source_label: 量子位

  # 2026-08-13 补充验证：钛媒体 feed 200 + 真 XML feed，可用
  - name: tmtpost
    url: https://www.tmtpost.com/feed
    type: rss
    category: domestic
    tier: 1
    enabled: true
    lang: zh
    source_label: 钛媒体

  # 2026-08-13 补充验证：cnBeta 官方站 .com 被限，用 .tw 镜像的 rss 端点（200 + XML feed）
  # 该端点的 TLS 证书链缺中间证书：本地 macOS 缓存了中间证书可通，GH Actions Ubuntu 验证失败。
  # insecure_tls: true 仅对本站关闭证书校验（见 fetchers/rss.py）。2026-08-13 实测本地 ok。
  - name: cnbeta
    url: https://rss.cnbeta.com.tw/
    type: rss
    category: domestic
    tier: 1
    enabled: true
    lang: zh
    source_label: cnBeta
    insecure_tls: true

  # 2026-08-13 补充验证：VentureBeat feed 200 + 真 XML feed，可用（AI 垂直外媒）
  - name: venturebeat
    url: https://venturebeat.com/feed/
    type: rss
    category: international
    tier: 1
    enabled: true
    lang: en
    source_label: VentureBeat

# 阶段2 需替代/补充的源（D2 存疑项）：
#   - infoq_cn      https://www.infoq.cn/feed    ⚠️ 200 但返回 HTML，非 feed → 需找正确端点
#   - jiqizhixin    https://www.jiqizhixin.com/rss ⚠️ 302 → JS 页，非 feed → 需找正确端点
