name: collect

on:
  schedule:
    # 每 2 小时一次，错开整点避免与大量整点任务撞车
    - cron: "23 */2 * * *"
  workflow_dispatch:  # 手动触发，方便调试

permissions:
  contents: write  # 允许 commit data/ 回仓库

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，archive 去重依赖历史数据

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: python scripts/collect.py --output-dir data --window-hours 24

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "data: 定时采集更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-output
          path: data/
          retention-days: 7
