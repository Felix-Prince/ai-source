name: collect

on:
  schedule:
    # 每 6 小时一次，错开整点避免与大量整点任务撞车（0:23 / 6:23 / 12:23 / 18:23 UTC）
    # 2026-08-13 从 2h 调为 6h：部分时段窗口内数据为空，2h 频率收益低
    - cron: "23 */6 * * *"
  workflow_dispatch:  # 手动触发，方便调试

permissions:
  contents: write  # 允许 commit data/ 回仓库
  pages: write     # 允许部署 Pages
  id-token: write  # Pages 部署需要 OIDC token

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，archive 去重依赖历史数据

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: python scripts/collect.py --output-dir data --window-hours 24

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "data: 定时采集更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .    # 整个仓库根作为 Pages 站点（index.html + data/）

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
